# La app se actualiza sola. Cada vez que llega a main un cambio de la app (movil/), se publica
# como actualización por internet (EAS Update) en el canal "preview", el que escuchan las APK que
# se compilan con ese perfil.
name: Actualizar la app

on:
  push:
    branches: [main]
    paths:
      - 'movil/**'
  # Para publicarla a mano desde la pestaña Actions, si hace falta.
  workflow_dispatch:

# Si llegan dos cambios seguidos, vale el último.
concurrency:
  group: actualizar-app
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar la actualización
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Nada roto llega a los teléfonos: si las pruebas fallan, no se publica.
      - name: Pruebas
        run: npm test
      - name: Publicar en el canal preview
        env:
          # El mensaje del commit, por variable y no pegado en el comando:
          # así unas comillas en el mensaje no rompen (ni inyectan) nada.
          MENSAJE: ${{ github.event.head_commit.message || 'Publicada a mano' }}
        run: |
          TITULO="$(printf '%s' "$MENSAJE" | head -n 1)"
          eas update --channel preview --platform android --non-interactive --message "$TITULO"
