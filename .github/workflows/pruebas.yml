# Revisión automática de cada cambio. En cada pull request (y al llegar a develop o main) corre,
# por separado y a la vez, lo de la web, el servidor, el servicio de analítica (Python) y la app:
# el linter, las pruebas y la construcción.
name: Pruebas

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Construir
        run: npm run build
        env:
          VITE_API_URL: https://cartify-tiendala635.onrender.com/api

  servidor:
    name: Servidor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test

  analitica:
    name: Analítica
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analitica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analitica/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: pytest -q

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test
      # La revisión oficial de Expo: versiones compatibles y configuración.
      - name: Revisión de Expo
        run: npx expo-doctor@latest
