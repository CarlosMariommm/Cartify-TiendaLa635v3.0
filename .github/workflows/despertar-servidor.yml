# Mantiene despierto el servidor de la tienda. Render, en el plan gratis, apaga el servidor tras
# 15 minutos sin visitas, y el primer cliente que llega después espera ~30 segundos viendo cargar
# (se midió: 31,5 s). Esto le toca la puerta cada 10 minutos para que nunca se duerma.
name: Despertar servidor

on:
  schedule:
    - cron: "*/10 * * * *"
  # Para correrlo a mano desde la pestaña Actions.
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tocar el servidor
        run: |
          curl --silent --show-error --output /dev/null --max-time 90 \
            --write-out "Respondió %{http_code} en %{time_total} s\n" \
            https://cartify-tiendala635.onrender.com/api/storeSettings || true
